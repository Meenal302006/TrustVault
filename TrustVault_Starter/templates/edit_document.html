{% extends "base.html" %}{% block title %}Edit document · TrustVault{% endblock %}{% block content %}
<div class="page-head"><div><p class="eyebrow">DOCUMENT MANAGEMENT</p><h1>Edit document details</h1><p class="muted">Editing metadata does not modify the file contents.</p></div><a class="text-link" href="{% url 'dashboard' %}">← Back to dashboard</a></div>
<section class="form-panel"><form method="post">{% csrf_token %}{% for field in form %}<label>{{ field.label }}{{ field }}{% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}</label>{% endfor %}<div class="form-actions"><button class="button" type="submit">Save changes</button><a class="text-link" href="{% url 'dashboard' %}">Cancel</a></div></form></section>
{% endblock %}
